backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "ar"

collections:
  - name: "posts"
    label: "المقالات"
    files:
      - file: "content/posts.json"
        label: "كل المقالات"
        name: "posts"
        fields:
          - label: "المقالات"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الرابط المختصر (slug - بالإنجليزية بدون فراغات)", name: "slug", widget: "string" }
              - { label: "التصنيف", name: "tag", widget: "string", required: false }
              - { label: "ملخص قصير", name: "excerpt", widget: "text", required: false }
              - { label: "تاريخ النشر", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "محتوى المقال", name: "body", widget: "markdown" }

  - name: "settings"
    label: "إعدادات الموقع"
    files:
      - file: "content/settings.json"
        label: "الإعدادات العامة"
        name: "settings"
        fields:
          - { label: "اسم الموقع", name: "site_title", widget: "string" }
          - { label: "الوصف القصير للموقع", name: "site_tagline", widget: "string" }
          - { label: "شارة أعلى العنوان الرئيسي", name: "hero_eyebrow", widget: "string" }
          - { label: "العنوان الرئيسي", name: "hero_title", widget: "string" }
          - { label: "الوصف تحت العنوان الرئيسي", name: "hero_subtitle", widget: "text" }
          - { label: "نص صفحة (حول)", name: "about_text", widget: "text" }
          - { label: "مقدمة صفحة الدعم المالي", name: "support_intro", widget: "text" }
          - { label: "نص التذييل", name: "footer_text", widget: "string" }
          - { label: "رابط PayPal", name: "paypal_url", widget: "string", required: false, hint: "مثال: https://paypal.me/username" }
          - { label: "رابط Ko-fi", name: "kofi_url", widget: "string", required: false, hint: "مثال: https://ko-fi.com/username" }
          - { label: "رابط Buy Me a Coffee", name: "buymeacoffee_url", widget: "string", required: false }
